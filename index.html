
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Image Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1877F2;
            --bg: #18191A;
            --text-primary: #E4E6EB;
            --text-secondary: #B0B3B8;
            --card-bg: #242526;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
            margin: 0;
        }
        
        /* Overrides to adapt theme classes */
        .bg-\[\#051610\], .bg-\[\#051610\]\/80, .bg-black\/40, .bg-black\/20 { background-color: var(--card-bg) !important; color: var(--text-primary) !important; }
        div[class*="from-white"], div[class*="from-purple"], div[class*="from-gray"], div[class*="from-emerald"], div[class*="from-orange"], div[class*="from-\[\#caf0f8\]"] { background-image: none !important; background-color: var(--bg) !important; }
        button[class*="from-white"], button[class*="from-purple"], button[class*="from-gray"], button[class*="from-emerald"], button[class*="from-orange"], button[class*="from-\[\#caf0f8\]"] { background-image: none !important; background-color: var(--bg) !important; color: var(--text-primary) !important; }
        button[class*="from-"]:hover { background-color: #3A3B3C !important; border-color: #3E4042 !important; }
        
        .text-slate-400 { color: var(--text-secondary) !important; }
        .text-white, .text-slate-200 { color: var(--text-primary) !important; }
        .text-slate-300 { color: var(--text-secondary) !important; }
        .text-cyan-400 { color: var(--primary) !important; }
        .bg-cyan-500, .bg-\[\#caf0f8\] { background-color: var(--primary) !important; color: white !important; border-color: var(--primary) !important; }
        .text-black, .text-\[\#051610\] { color: white !important; }
        
        .glass-card {
            background: var(--card-bg) !important;
            border-radius: 8px !important;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4) !important;
            border: 1px solid #3E4042 !important;
            backdrop-filter: none !important;
        }

        .vibrant-button {
            background: var(--primary) !important;
            color: white !important;
            border-radius: 6px !important;
            font-weight: 600 !important;
            border: none !important;
            transition: background-color 0.2s !important;
            box-shadow: none !important;
        }
        .vibrant-button:hover {
            background: #166FE5 !important;
            transform: none !important;
            filter: none !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3E4042;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4E4F50;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        select, input[type="text"], textarea {
            background-color: var(--bg) !important;
            border: none !important;
            color: var(--text-primary) !important;
            border-radius: 8px !important;
        }
        select:focus, input[type="text"]:focus, textarea:focus {
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.4) !important;
            outline: none !important;
        }
        
        button.bg-white\/5 {
            background-color: #3A3B3C !important;
            border-color: transparent !important;
            color: #E4E6EB !important;
        }
        button.bg-white\/5:hover {
            background-color: #4E4F50 !important;
        }
        
        .border-white\/10, .border-white\/20, .border-white\/5 {
            border-color: #3E4042 !important;
        }
        
        .mesh-gradient { display: none; }
    </style>
</head>
<body>
    <div class="mesh-gradient"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
